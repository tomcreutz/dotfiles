# Use the standalone SilentSDDM theme for both migrated and fresh Hyprland
# systems. It keeps SDDM's session/PAM behavior without requiring Plasma.
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent
